name: Repository Quality
on:
  push:
  pull_request:
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for conflict markers
        run: |
          if grep -RIn --exclude-dir=.git --exclude='*.lock' -E '^(<<<<<<<|=======|>>>>>>>)( |$)' .; then
            echo 'Conflict markers found.'; exit 1
          fi
      - name: .NET build and tests
        shell: bash
        run: |
          mapfile -t projects < <(find . -name '*.csproj' -not -path '*/bin/*' -not -path '*/obj/*')
          if [ ${#projects[@]} -gt 0 ]; then
            dotnet --info
            for project in "${projects[@]}"; do dotnet build "$project" -c Release; done
          fi
          mapfile -t tests < <(find . -name '*Tests.csproj' -o -name '*.Tests.csproj')
          for test in "${tests[@]}"; do dotnet test "$test" -c Release --no-restore || dotnet test "$test" -c Release; done
      - name: Node build and tests
        shell: bash
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
            npm test --if-present -- --watch=false
          fi
